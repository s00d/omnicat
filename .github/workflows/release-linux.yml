name: Release (Linux)

# Builds Linux binaries for every supported architecture and attaches them
# to the GitHub release of the tag. Runs on tag push or manually.
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and upload to (e.g. 0.10.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, deb: x86_64-linux-gnu }
          - { target: aarch64-unknown-linux-gnu, deb: aarch64-linux-gnu }
          - { target: armv7-unknown-linux-gnueabihf, deb: arm-linux-gnueabihf }
          - { target: arm-unknown-linux-gnueabihf, deb: arm-linux-gnueabihf }
          - { target: i686-unknown-linux-gnu, deb: i386-linux-gnu }
          - { target: riscv64gc-unknown-linux-gnu, deb: riscv64-linux-gnu }
          - { target: powerpc64le-unknown-linux-gnu, deb: powerpc64le-linux-gnu }
          - { target: s390x-unknown-linux-gnu, deb: s390x-linux-gnu }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # Build the tag's sources with this workflow revision's Cross.toml.
      - run: git fetch --depth 1 origin ${{ github.sha }} && git checkout FETCH_HEAD -- Cross.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        env:
          PKG_CONFIG_PATH: /usr/lib/${{ matrix.deb }}/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: cross build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          name="omnicat-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/omnicat" README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --latest --generate-notes
          gh release upload "$TAG" dist/* --clobber
