[package]
name = "omnicat"
version = "0.10.0"
edition = "2021"
rust-version = "1.92"
description = "Universal file preview for the terminal — a context-aware cat"
license = "MIT"
readme = "README.md"
repository = "https://github.com/s00d/omnicat"
homepage = "https://github.com/s00d/omnicat"

[[bin]]
name = "omnicat"
path = "src/main.rs"

[lib]
name = "omnicat"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
arrow = "58.3"
calamine = "0.36.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
comfy-table = { version = "7", features = ["custom_styling"] }
crossterm = "0.29"
csv = "1"
flate2 = "1"
image = "0.25"
infer = "0.19"
mime_guess = "2"
ini = "1"
is-terminal = "0.4"
once_cell = "1"
pulldown-cmark = "0.13"
mail-parser = "0.11"
mp4parse = "0.17"
parquet = { version = "58.3", features = ["arrow"] }
plist = { version = "1", features = ["serde"] }
rusqlite = { version = "0.39", features = ["bundled"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sevenz-rust = "0.6"
shell-words = "1"
symphonia = { version = "0.6", features = ["all"] }
rodio = { version = "0.22", default-features = true }
syntect = "5"
tar = "0.4"
thiserror = "2"
toml = "1"
ttf-parser = "0.25"
viuer = { version = "0.11", features = ["print-file"] }
wait-timeout = "0.2"
which = "8"
zip = "8"
bzip2 = "0.6.1"
liblzma = "0.4"
mobi = "0.8"
mermaid-text = "0.56.1"
blake3 = "1.8.6"
sha2 = "0.11.0"
md-5 = "0.11.0"
sha1 = "0.11.0"
hex = "0.4.3"
zstd = "0.13.3"
memchr = "2.8.3"
memmap2 = "0.9.11"
anydoc = "0.1.7"
htmd = "0.5"
roxmltree = "0.21"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
assert_cmd = "2"
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1", features = ["filters"] }
portable-pty = "0.9"
predicates = "3"

[[bench]]
name = "perf"
harness = false

[lints.rust]
linker_messages = "allow"

[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.release]
opt-level = "z" # Оптимизация для размера
lto = true # Включение Link Time Optimization
codegen-units = 1 # Уменьшение количества единиц компиляции для лучшей оптимизации
panic = "abort" # Уменьшение объема кода для обработки паник
strip = true # Удаление символов отладки
