# System libs for cross-compiled Linux targets (rodio/alsa-sys, liblzma).
[build]
pre-build = [
  "dpkg --add-architecture $CROSS_DEB_ARCH",
  "apt-get update && apt-get install -y --no-install-recommends pkg-config libasound2-dev:$CROSS_DEB_ARCH liblzma-dev:$CROSS_DEB_ARCH",
]

# Workflow sets PKG_CONFIG_PATH=/usr/lib/<deb-triplet>/pkgconfig per target.
[build.env]
passthrough = ["PKG_CONFIG_PATH", "PKG_CONFIG_ALLOW_CROSS"]
