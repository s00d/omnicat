terminal:
  markdown:
    theme: default
    wrap_width: 80
    heading_color: cyan
    link_color: blue
  code:
    line_numbers: true
    # Syntax-highlighting theme. "auto" detects the terminal background (via OSC 11
    # query, then COLORFGBG) and picks a readable theme; use "light"/"dark" to force
    # one, or any syntect theme name (e.g. base16-ocean.dark, InspiredGitHub).
    theme: auto
    style: numbers
    tab_width: 4
  data:
    pretty: true
    table_border: true
    max_rows: 1000
    max_cols: 50
    header_row: true
  image:
    max_width: 0
    protocol: auto
  media:
    playback: true
  archive:
    long_format: true
    max_entries: 500
    tree_style: unicode
  directory:
    max_depth: 1
    max_entries: 500
    show_hidden: false
    icons: false
  fallback:
    max_bytes: 65536
    hex_cols: 16
    show_metadata: true
  paginate:
    page_lines: 0
  document:
    max_chars: 5000

inspect:
  max_bytes: 10485760
  max_matches: 200
  max_rows: 1000

# Optional external renderer chains (legacy smartcat-compatible).
# Builtin drivers run when no external command succeeds.
# handlers:
#   markdown:
#     commands:
#       - glow {file}
#       - mdcat {file}
#     hint: "For rendered Markdown: brew install glow"
#   image:
#     commands:
#       - imgcat {file}
#       - chafa {file}
#     hint: "brew install chafa or use iTerm2 imgcat"
#   notebook:
#     extensions: [ipynb]
#     commands:
#       - jupytext --to markdown -o - {file}
#     hint: "brew install jupytext"

behavior:
  on_unknown_format: fallback
  external_timeout_secs: 30
