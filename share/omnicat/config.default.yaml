terminal:
  markdown:
    theme: default
    wrap_width: 80
    heading_color: cyan
    link_color: blue
  code:
    line_numbers: true
    # "auto" adapts to a light or dark terminal; also accepts "light"/"dark" or a
    # syntect theme name (e.g. base16-ocean.dark, InspiredGitHub).
    theme: auto
    style: numbers
    tab_width: 4
  data:
    pretty: true
    table_border: true
    max_rows: 1000
    max_cols: 50
    header_row: true
  image:
    max_width: 0
    protocol: auto
  media:
    playback: true
  archive:
    long_format: true
    max_entries: 500
    tree_style: unicode
  directory:
    max_depth: 1
    max_entries: 500
    show_hidden: false
    icons: false
  fallback:
    max_bytes: 65536
    hex_cols: 16
    show_metadata: true
  document:
    max_chars: 5000

behavior:
  on_unknown_format: fallback
