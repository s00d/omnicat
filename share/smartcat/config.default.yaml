display:
  markdown:
    theme: default
    wrap_width: 80
  code:
    line_numbers: true
    # "auto" adapts to a light or dark terminal; also accepts "light"/"dark" or a
    # syntect theme name (e.g. base16-ocean.dark, InspiredGitHub).
    theme: auto
    style: numbers
  data:
    pretty: true
    table_border: true
  image:
    max_width: 0
    protocol: auto
  pdf:
    page_separator: true
  archive:
    long_format: true
